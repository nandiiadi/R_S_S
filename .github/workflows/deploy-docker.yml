name: Build and publish Docker image

# Publishes to GitHub Container Registry (ghcr.io) — works for any fork
# with zero extra secrets. The image is public when the repo is public.
#
# Image name: ghcr.io/<owner>/<repo>:latest  (main branch)
#             ghcr.io/<owner>/<repo>:<sha>    (per-commit, main branch)
#             ghcr.io/<owner>/<repo>:<semver> (on v* tags)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - ".editorconfig"
      - ".github/**"
      - ".gitignore"
      - ".prettierignore"
      - ".prettierrc"
      - "docs/**"
      - "eslint.config.mjs"
      - "README.md"

  workflow_run:
    workflows: ["Dependabot auto-merge"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,mode=max,scope=docker-release
