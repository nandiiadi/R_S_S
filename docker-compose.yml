services:

  # ===== ReactFlux SPA (Caddy) =================================================
  reactflux:
    image: ghcr.io/nandiiadi/r_s_s:latest
    restart: unless-stopped
    ports:
      - "${REACTFLUX_PORT:-2000}:2000"
    depends_on:
      - mercury-proxy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== Mercury Parser Sidecar ================================================
  mercury-proxy:
    build: ./mercury-proxy
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      PORT: "3001"
      TIMEOUT_MS: "15000"
      CORS_ORIGIN: "*"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== Miniflux RSS Backend ==================================================
  miniflux:
    image: miniflux/miniflux:latest
    restart: unless-stopped
    ports:
      - "${MINIFLUX_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://miniflux:${POSTGRES_PASSWORD:-miniflux}@db/miniflux?sslmode=disable"
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: "${MINIFLUX_ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${MINIFLUX_ADMIN_PASSWORD:-changeme}"
      BASE_URL: "http://localhost:${MINIFLUX_PORT:-8080}"
    networks:
      - internal

  # ===== PostgreSQL ============================================================
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: miniflux
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-miniflux}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
