services:

  # ── ReactFlux SPA (Caddy) ────────────────────────────────────────────────────
  reactflux:
    build:
      context: .
      args:
        # Relative path: browser resolves against its own origin (http://host:2000).
        # Caddy strips /mercury and forwards to the sidecar internally.
        VITE_MERCURY_PROXY_URL: /mercury
    restart: unless-stopped
    ports:
      - "${REACTFLUX_PORT:-2000}:2000"
    depends_on:
      - mercury-proxy
    networks:
      - internal

  # ── Mercury Parser sidecar ──────────────────────────────────────────────────
  # Not exposed on a host port — reached only via Caddy at /mercury/*
  mercury-proxy:
    build: ./mercury-proxy
    restart: unless-stopped
    environment:
      PORT: "3001"
      TIMEOUT_MS: "15000"
      CORS_ORIGIN: "*"
    networks:
      - internal

  # ── Miniflux RSS backend ─────────────────────────────────────────────────────
  miniflux:
    image: miniflux/miniflux:latest
    restart: unless-stopped
    ports:
      - "${MINIFLUX_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://miniflux:${POSTGRES_PASSWORD:-miniflux}@db/miniflux?sslmode=disable"
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: "${MINIFLUX_ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${MINIFLUX_ADMIN_PASSWORD:-changeme}"
    networks:
      - internal

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: miniflux
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-miniflux}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
